<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colección y Tienda</title>
    <!-- Script oficial de Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0d0d12;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        h1 { font-size: 18px; color: #00ffcc; margin-bottom: 5px; }
        
        /* Cabecera */
        .header-bar {
            background: #161622;
            border: 1px solid #2a2a3d;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        .coins { color: #ffd700; font-weight: bold; }

        /* Pestañas */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: #1a1a24;
            border: 1px solid #333;
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .tab-btn.active {
            background: #00ffcc;
            color: #0d0d12;
            border-color: #00ffcc;
        }

        .section { display: none; }
        .section.active { display: block; }

        /* Lupa de búsqueda */
        .search-container { margin-bottom: 15px; }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #1a1a24;
            color: #fff;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
        }
        input[type="text"]:focus { border-color: #00ffcc; }

        /* Cuadrícula */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .card {
            background: #161622;
            border: 1px solid #2a2a3d;
            border-radius: 10px;
            padding: 8px;
            text-align: left;
        }
        .card img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 6px;
            background: #000;
        }
        .card h3 { font-size: 13px; margin: 6px 0 2px 0; color: #fff; }
        .card p { font-size: 11px; color: #00ffcc; margin: 0; }
    </style>
</head>
<body>

    <!-- Cabecera con Monedas -->
    <div class="header-bar">
        <span id="username">Cargando...</span>
        <span class="coins">🪙 <span id="user-coins">0</span></span>
    </div>

    <!-- Pestañas -->
    <div class="tabs">
        <button class="tab-btn active" onclick="cambiarPestaña('coleccion')">🎒 Colección</button>
        <button class="tab-btn" onclick="cambiarPestaña('tienda')">🛒 Tienda</button>
    </div>

    <!-- SECCIÓN: COLECCIÓN -->
    <div id="seccion-coleccion" class="section active">
        <div class="search-container">
            <input type="text" id="buscador" placeholder="🔍 Buscar nombre o #categoría..." onkeyup="filtrarPersonajes()">
        </div>
        <div class="grid" id="catalogo-coleccion">
            <!-- Se llena dinámicamente desde el JSON externo -->
        </div>
    </div>

    <!-- SECCIÓN: TIENDA -->
    <div id="seccion-tienda" class="section">
        <h1>Tienda de Invocación</h1>
        <p style="font-size: 12px; color: #aaa;">Gasta tus monedas para conseguir nuevos personajes.</p>
        <div style="background: #161622; border: 1px solid #2a2a3d; border-radius: 10px; padding: 15px; margin-top: 15px;">
            <h3>Cofre Aleatorio</h3>
            <p style="font-size: 12px; color: #ffd700;">Precio: 100 Monedas</p>
            <button style="background: #00ffcc; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 5px;" onclick="comprarCofre()">Tirar Gacha</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
        } else {
            document.getElementById('username').innerText = "Usuario";
        }

        let listaPersonajes = [];

        // AQUÍ CAMBIA LA RUTA: Si tu index.html está en una carpeta y personajes.json está afuera, usamos "../" para salir un nivel
        async function cargarPersonajes() {
            try {
                let respuesta = await fetch('../personajes.json'); 
                listaPersonajes = await respuesta.json();
                mostrarPersonajes(listaPersonajes);
            } catch (error) {
                console.error("Error al cargar los personajes:", error);
                document.getElementById('catalogo-coleccion').innerHTML = "<p style='grid-column: span 2; color: #ff4d4d;'>No se pudo leer personajes.json desde la ruta externa.</p>";
            }
        }

        function mostrarPersonajes(personajes) {
            const contenedor = document.getElementById('catalogo-coleccion');
            contenedor.innerHTML = "";

            if (personajes.length === 0) {
                contenedor.innerHTML = "<p style='grid-column: span 2; color: #777;'>No se encontraron personajes...</p>";
                return;
            }

            personajes.forEach(p => {
                contenedor.innerHTML += `
                    <div class="card">
                        <img src="${p.imagen}" alt="${p.nombre}">
                        <h3>${p.nombre}</h3>
                        <p>${p.categoria} • ${p.rareza}</p>
                    </div>
                `;
            });
        }

        function filtrarPersonajes() {
            const texto = document.getElementById('buscador').value.toLowerCase();
            
            const filtrados = listaPersonajes.filter(p => {
                const coincideNombre = p.nombre.toLowerCase().includes(texto);
                const coincideCategoria = p.categoria.toLowerCase().includes(texto);
                return coincideNombre || coincideCategoria;
            });

            mostrarPersonajes(filtrados);
        }

        function cambiarPestaña(seccion) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

            if (seccion === 'coleccion') {
                document.getElementById('seccion-coleccion').classList.add('active');
                event.target.classList.add('active');
            } else {
                document.getElementById('seccion-tienda').classList.add('active');
                event.target.classList.add('active');
            }
        }

        function comprarCofre() {
            alert("¡Función de compra conectada al servidor!");
        }

        cargarPersonajes();
    </script>
</body>
</html>
